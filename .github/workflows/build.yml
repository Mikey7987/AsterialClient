name: Build Velour 1.21.11 All-In-One

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate Project Files
        run: |
          mkdir -p src/main/java/com/velour/client/module/setting
          mkdir -p src/main/java/com/velour/client/module/impl
          mkdir -p src/main/java/com/velour/client/gui
          mkdir -p src/main/resources

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          fabric_version=0.141.2+1.21.11
          mod_version=1.0.0
          maven_group=com.velour
          archives_base_name=velour-1.21.11
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.14.4'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "velour",
            "version": "${version}",
            "name": "Velour",
            "description": "1.21.11 Fabric PvP client with Right Shift ClickGUI.",
            "authors": ["Velour"],
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.velour.client.VelourClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.18.4",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/VelourClient.java
          package com.velour.client;

          import com.velour.client.gui.ClickGuiScreen;
          import com.velour.client.module.ModuleManager;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public class VelourClient implements ClientModInitializer {
              public static final String MOD_ID = "velour";
              public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

              private static VelourClient instance;
              private ModuleManager moduleManager;
              private KeyBinding clickGuiKey;
              private boolean rightShiftWasDown = false;

              @Override
              public void onInitializeClient() {
                  instance = this;
                  this.moduleManager = new ModuleManager();

                  this.clickGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.velour.clickgui",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT,
                          KeyBinding.Category.create(Identifier.of(MOD_ID, "general"))
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(this::onClientTick);
                  LOGGER.info("Velour 1.21.11 initialized.");
              }

              private void onClientTick(MinecraftClient client) {
                  if (client.player == null) return;

                  long windowHandle = client.getWindow().getHandle();
                  boolean rightShiftDown = GLFW.glfwGetKey(windowHandle, GLFW.GLFW_KEY_RIGHT_SHIFT) == GLFW.GLFW_PRESS;

                  if ((clickGuiKey.wasPressed() || (rightShiftDown && !rightShiftWasDown)) && client.currentScreen == null) {
                      client.setScreen(new ClickGuiScreen(moduleManager));
                  }
                  rightShiftWasDown = rightShiftDown;

                  if (client.currentScreen == null) {
                      moduleManager.onTick(client);
                  }
              }

              public static VelourClient getInstance() {
                  return instance;
              }

              public ModuleManager getModuleManager() {
                  return moduleManager;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/Category.java
          package com.velour.client.module;

          public enum Category {
              COMBAT("Combat"),
              MOVEMENT("Movement");

              private final String displayName;

              Category(String displayName) {
                  this.displayName = displayName;
              }

              public String getDisplayName() {
                  return displayName;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/Module.java
          package com.velour.client.module;

          import com.velour.client.module.setting.Setting;
          import net.minecraft.client.MinecraftClient;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public abstract class Module {
              private final String name;
              private final String description;
              private final Category category;
              private final List<Setting<?>> settings = new ArrayList<>();
              private boolean enabled;

              protected Module(String name, String description, Category category) {
                  this.name = name;
                  this.description = description;
                  this.category = category;
              }

              protected <T extends Setting<?>> T addSetting(T setting) {
                  settings.add(setting);
                  return setting;
              }

              public List<Setting<?>> getSettings() {
                  return Collections.unmodifiableList(settings);
              }

              public String getName() {
                  return name;
              }

              public String getDescription() {
                  return description;
              }

              public Category getCategory() {
                  return category;
              }

              public boolean isEnabled() {
                  return enabled;
              }

              public void setEnabled(boolean enabled) {
                  if (this.enabled == enabled) return;
                  this.enabled = enabled;
                  if (enabled) {
                      onEnable();
                  } else {
                      onDisable();
                  }
              }

              public void toggle() {
                  setEnabled(!this.enabled);
              }

              protected void onEnable() {}
              protected void onDisable() {}
              public void onTick(MinecraftClient client) {}
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/setting/Setting.java
          package com.velour.client.module.setting;

          public abstract class Setting<T> {
              private final String name;
              protected T value;

              protected Setting(String name, T defaultValue) {
                  this.name = name;
                  this.value = defaultValue;
              }

              public String getName() {
                  return name;
              }

              public T getValue() {
                  return value;
              }

              public void setValue(T value) {
                  this.value = value;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/setting/BooleanSetting.java
          package com.velour.client.module.setting;

          public class BooleanSetting extends Setting<Boolean> {
              public BooleanSetting(String name, boolean defaultValue) {
                  super(name, defaultValue);
              }

              public void toggle() {
                  this.value = !this.value;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/setting/NumberSetting.java
          package com.velour.client.module.setting;

          public class NumberSetting extends Setting<Double> {
              private final double min;
              private final double max;
              private final double step;

              public NumberSetting(String name, double defaultValue, double min, double max, double step) {
                  super(name, defaultValue);
                  this.min = min;
                  this.max = max;
                  this.step = step;
              }

              public double getMin() {
                  return min;
              }

              public double getMax() {
                  return max;
              }

              public double getStep() {
                  return step;
              }

              @Override
              public void setValue(Double newVal) {
                  double clamped = Math.max(min, Math.min(max, newVal));
                  double snapped = Math.round(clamped / step) * step;
                  this.value = Math.max(min, Math.min(max, Math.round(snapped * 1000.0) / 1000.0));
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/ModuleManager.java
          package com.velour.client.module;

          import com.velour.client.module.impl.AimAssistModule;
          import com.velour.client.module.impl.AutoJumpResetModule;
          import com.velour.client.module.impl.AutoShieldBreakerModule;
          import com.velour.client.module.impl.TriggerBotModule;
          import net.minecraft.client.MinecraftClient;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public class ModuleManager {
              private final List<Module> modules = new ArrayList<>();

              public ModuleManager() {
                  modules.add(new AimAssistModule());
                  modules.add(new TriggerBotModule());
                  modules.add(new AutoShieldBreakerModule());
                  modules.add(new AutoJumpResetModule());
              }

              public List<Module> getModules() {
                  return Collections.unmodifiableList(modules);
              }

              public List<Module> getByCategory(Category category) {
                  List<Module> out = new ArrayList<>();
                  for (Module m : modules) {
                      if (m.getCategory() == category) out.add(m);
                  }
                  return out;
              }

              public void onTick(MinecraftClient client) {
                  for (Module module : modules) {
                      if (module.isEnabled()) {
                          module.onTick(client);
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/impl/AimAssistModule.java
          package com.velour.client.module.impl;

          import com.velour.client.module.Category;
          import com.velour.client.module.Module;
          import com.velour.client.module.setting.BooleanSetting;
          import com.velour.client.module.setting.NumberSetting;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;

          import java.util.Comparator;
          import java.util.List;
          import java.util.concurrent.ThreadLocalRandom;

          public class AimAssistModule extends Module {
              private final NumberSetting range = addSetting(new NumberSetting("Range", 4.2, 2.5, 6.5, 0.1));
              private final NumberSetting fov = addSetting(new NumberSetting("FOV", 110.0, 20.0, 180.0, 5.0));
              private final NumberSetting hSmooth = addSetting(new NumberSetting("H-Smooth", 34.0, 5.0, 95.0, 1.0));
              private final NumberSetting vSmooth = addSetting(new NumberSetting("V-Smooth", 18.0, 0.0, 80.0, 1.0));
              private final NumberSetting stickiness = addSetting(new NumberSetting("Stickiness", 0.65, 0.0, 1.0, 0.05));
              private final NumberSetting prediction = addSetting(new NumberSetting("Prediction", 0.25, 0.0, 1.0, 0.05));
              private final NumberSetting aimHeight = addSetting(new NumberSetting("Aim Height", 0.72, 0.2, 0.95, 0.02));
              private final NumberSetting deadzone = addSetting(new NumberSetting("Deadzone Deg", 0.6, 0.0, 4.0, 0.1));
              private final NumberSetting microDrift = addSetting(new NumberSetting("Micro Drift", 0.04, 0.0, 0.35, 0.01));
              private final BooleanSetting verticalAim = addSetting(new BooleanSetting("Vertical Aim", true));
              private final BooleanSetting lockClosestCrosshair = addSetting(new BooleanSetting("Prioritize Center", true));
              private final BooleanSetting playersOnly = addSetting(new BooleanSetting("Players Only", true));
              private final BooleanSetting ignoreInvis = addSetting(new BooleanSetting("Ignore Invis", false));

              private LivingEntity stickyTarget = null;
              private float smoothYawVel = 0.0f;
              private float smoothPitchVel = 0.0f;

              public AimAssistModule() {
                  super("AimAssist", "Sticky, velocity-predicted smooth aim assist without click-gating.", Category.COMBAT);
              }

              @Override
              protected void onDisable() {
                  stickyTarget = null;
                  smoothYawVel = 0.0f;
                  smoothPitchVel = 0.0f;
              }

              @Override
              public void onTick(MinecraftClient client) {
                  if (client.player == null || client.world == null) return;

                  PlayerEntity self = client.player;
                  double maxDist = range.getValue();

                  List<LivingEntity> candidates = client.world.getEntitiesByClass(
                          LivingEntity.class,
                          self.getBoundingBox().expand(maxDist + 0.5),
                          entity -> isValidCandidate(self, entity, maxDist)
                  );

                  if (candidates.isEmpty()) {
                      stickyTarget = null;
                      decayVelocity();
                      return;
                  }

                  LivingEntity chosen = selectTarget(self, candidates);
                  if (chosen == null) {
                      decayVelocity();
                      return;
                  }
                  stickyTarget = chosen;

                  Vec3d eyePos = self.getEyePos();
                  Box box = chosen.getBoundingBox();

                  // Predict target movement slightly so fast strafes stay tracked smoothly
                  double predTicks = prediction.getValue() * 2.2;
                  Vec3d vel = chosen.getVelocity();
                  double predX = (box.minX + box.maxX) * 0.5 + vel.x * predTicks;
                  double predZ = (box.minZ + box.maxZ) * 0.5 + vel.z * predTicks;

                  double targetY;
                  if (verticalAim.getValue()) {
                      double clampedRatio = MathHelper.clamp(aimHeight.getValue().floatValue(), 0.2f, 0.95f);
                      targetY = box.minY + (box.maxY - box.minY) * clampedRatio + vel.y * (predTicks * 0.4);
                  } else {
                      targetY = eyePos.y;
                  }

                  double dx = predX - eyePos.x;
                  double dy = targetY - eyePos.y;
                  double dz = predZ - eyePos.z;
                  double horizDist = Math.max(0.05, Math.sqrt(dx * dx + dz * dz));

                  float desiredYaw = (float) (MathHelper.atan2(dz, dx) * (180.0 / Math.PI)) - 90.0f;
                  float desiredPitch = (float) (-(MathHelper.atan2(dy, horizDist) * (180.0 / Math.PI)));

                  float yawDelta = MathHelper.wrapDegrees(desiredYaw - self.getYaw());
                  float pitchDelta = MathHelper.wrapDegrees(desiredPitch - self.getPitch());

                  // Small deadzone prevents micro-stutter when already lined up
                  float dzDeg = deadzone.getValue().floatValue();
                  if (Math.abs(yawDelta) < dzDeg) {
                      yawDelta = 0.0f;
                  }

                  // Critically damped / ease-out tracking: pulls faster when off-target, eases gently near center
                  double hFactor = MathHelper.clamp(hSmooth.getValue() / 100.0, 0.04, 0.95);
                  float curveBoost = (float) (0.75 + Math.min(0.85, Math.abs(yawDelta) / 35.0));
                  float targetYawStep = (float) (yawDelta * hFactor * curveBoost);

                  ThreadLocalRandom rng = ThreadLocalRandom.current();
                  float drift = microDrift.getValue().floatValue();
                  if (drift > 0.0f && Math.abs(yawDelta) > dzDeg) {
                      targetYawStep += (float) (rng.nextGaussian() * drift);
                  }

                  // Spring-like damping so rotation has inertia and never snaps
                  smoothYawVel = MathHelper.lerp(0.55f, smoothYawVel, targetYawStep);
                  self.setYaw(self.getYaw() + smoothYawVel);

                  if (verticalAim.getValue() && vSmooth.getValue() > 0.0) {
                      if (Math.abs(pitchDelta) < dzDeg * 0.8f) {
                          pitchDelta = 0.0f;
                      }
                      double vFactor = MathHelper.clamp(vSmooth.getValue() / 100.0, 0.02, 0.85);
                      float targetPitchStep = (float) (pitchDelta * vFactor * 0.85f);
                      if (drift > 0.0f && Math.abs(pitchDelta) > dzDeg) {
                          targetPitchStep += (float) (rng.nextGaussian() * drift * 0.35f);
                      }
                      smoothPitchVel = MathHelper.lerp(0.45f, smoothPitchVel, targetPitchStep);
                      self.setPitch(MathHelper.clamp(self.getPitch() + smoothPitchVel, -90.0f, 90.0f));
                  }
              }

              private LivingEntity selectTarget(PlayerEntity self, List<LivingEntity> candidates) {
                  double halfFov = fov.getValue() * 0.5;

                  // Keep current sticky target if still valid and within a slightly wider retention FOV
                  if (stickyTarget != null && candidates.contains(stickyTarget)) {
                      double stickAngle = angleToEntity(self, stickyTarget);
                      double keepLimit = halfFov * (1.0 + stickiness.getValue() * 0.35);
                      if (stickAngle <= keepLimit) {
                          // If another target is MUCH closer to crosshair and stickiness is low, allow switch
                          if (!lockClosestCrosshair.getValue()) {
                              return stickyTarget;
                          }
                          LivingEntity best = candidates.stream()
                                  .filter(e -> angleToEntity(self, e) <= halfFov)
                                  .min(Comparator.comparingDouble(e -> targetScore(self, e)))
                                  .orElse(stickyTarget);
                          if (best == stickyTarget) return stickyTarget;
                          double bestScore = targetScore(self, best);
                          double currentScore = targetScore(self, stickyTarget);
                          if (bestScore < currentScore * (0.55 - stickiness.getValue() * 0.35)) {
                              return best;
                          }
                          return stickyTarget;
                      }
                  }

                  return candidates.stream()
                          .filter(e -> angleToEntity(self, e) <= halfFov)
                          .min(Comparator.comparingDouble(e -> targetScore(self, e)))
                          .orElse(null);
              }

              private double targetScore(PlayerEntity self, LivingEntity entity) {
                  double ang = angleToEntity(self, entity);
                  double dist = self.distanceTo(entity);
                  return ang * 1.35 + dist * 2.5;
              }

              private boolean isValidCandidate(PlayerEntity self, LivingEntity entity, double maxDist) {
                  if (entity == null || entity == self || !entity.isAlive() || entity.isSpectator()) return false;
                  if (playersOnly.getValue() && !(entity instanceof PlayerEntity)) return false;
                  if (ignoreInvis.getValue() && entity.isInvisible()) return false;
                  return self.distanceTo(entity) <= maxDist;
              }

              private double angleToEntity(PlayerEntity self, LivingEntity entity) {
                  Vec3d eyePos = self.getEyePos();
                  Vec3d center = entity.getBoundingBox().getCenter();
                  double dx = center.x - eyePos.x;
                  double dz = center.z - eyePos.z;
                  float targetYaw = (float) (MathHelper.atan2(dz, dx) * (180.0 / Math.PI)) - 90.0f;
                  return Math.abs(MathHelper.wrapDegrees(targetYaw - self.getYaw()));
              }

              private void decayVelocity() {
                  smoothYawVel *= 0.5f;
                  smoothPitchVel *= 0.5f;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/impl/TriggerBotModule.java
          package com.velour.client.module.impl;

          import com.velour.client.module.Category;
          import com.velour.client.module.Module;
          import com.velour.client.module.setting.BooleanSetting;
          import com.velour.client.module.setting.NumberSetting;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.Hand;
          import net.minecraft.util.hit.EntityHitResult;

          import java.util.concurrent.ThreadLocalRandom;

          public class TriggerBotModule extends Module {
              private final NumberSetting minCps = addSetting(new NumberSetting("Min CPS", 8.0, 1.0, 20.0, 0.5));
              private final NumberSetting maxCps = addSetting(new NumberSetting("Max CPS", 12.0, 1.0, 20.0, 0.5));
              private final NumberSetting reactionMs = addSetting(new NumberSetting("Reaction ms", 35.0, 0.0, 180.0, 5.0));
              private final NumberSetting cooldownReq = addSetting(new NumberSetting("Cooldown Req", 0.94, 0.5, 1.0, 0.01));
              private final NumberSetting hitChance = addSetting(new NumberSetting("Hit Chance %", 100.0, 10.0, 100.0, 1.0));
              private final BooleanSetting onlyCrits = addSetting(new BooleanSetting("Only Crits", false));
              private final BooleanSetting smartCrits = addSetting(new BooleanSetting("Smart Crits", true));
              private final BooleanSetting requireSprint = addSetting(new BooleanSetting("Require Sprint", false));
              private final BooleanSetting stopSprintOnCrit = addSetting(new BooleanSetting("Stop Sprint Crit", false));
              private final BooleanSetting respectShield = addSetting(new BooleanSetting("Respect Shield", true));
              private final BooleanSetting playersOnly = addSetting(new BooleanSetting("Players Only", true));
              private final BooleanSetting swingOnlyOnHit = addSetting(new BooleanSetting("Swing On Hit", true));

              private long targetAcquiredAtMs = -1L;
              private long nextAllowedAttackMs = 0L;
              private int lastTargetId = -1;

              public TriggerBotModule() {
                  super("TriggerBot", "1.21 cooldown-aware triggerbot with reaction delay, crit sync & shield checks.", Category.COMBAT);
              }

              @Override
              protected void onDisable() {
                  targetAcquiredAtMs = -1L;
                  lastTargetId = -1;
              }

              @Override
              public void onTick(MinecraftClient client) {
                  if (client.player == null || client.interactionManager == null) return;

                  if (!(client.crosshairTarget instanceof EntityHitResult hitResult)) {
                      targetAcquiredAtMs = -1L;
                      lastTargetId = -1;
                      return;
                  }

                  Entity target = hitResult.getEntity();
                  if (!(target instanceof LivingEntity living) || !living.isAlive() || target.isSpectator()) {
                      targetAcquiredAtMs = -1L;
                      lastTargetId = -1;
                      return;
                  }

                  if (playersOnly.getValue() && !(target instanceof PlayerEntity)) {
                      targetAcquiredAtMs = -1L;
                      return;
                  }

                  if (respectShield.getValue() && target instanceof PlayerEntity targetPlayer && targetPlayer.isBlocking()) {
                      return;
                  }

                  long now = System.currentTimeMillis();
                  if (target.getId() != lastTargetId) {
                      lastTargetId = target.getId();
                      targetAcquiredAtMs = now;
                  } else if (targetAcquiredAtMs == -1L) {
                      targetAcquiredAtMs = now;
                  }

                  // Human-like reaction delay after target enters crosshair
                  double jitterFactor = 0.75 + ThreadLocalRandom.current().nextDouble() * 0.50;
                  long neededDelay = (long) (reactionMs.getValue() * jitterFactor);
                  if (now - targetAcquiredAtMs < neededDelay) {
                      return;
                  }

                  if (now < nextAllowedAttackMs) return;

                  // Wait for 1.21 weapon cooldown so attacks deal full damage instead of weak spam hits
                  float cooldown = client.player.getAttackCooldownProgress(0.5f);
                  if (cooldown < cooldownReq.getValue().floatValue()) {
                      return;
                  }

                  boolean canCritNow = isFallingCritWindow(client);
                  if (onlyCrits.getValue()) {
                      if (!canCritNow) return;
                  } else if (smartCrits.getValue()) {
                      // If player is mid-air going up or just started falling, wait briefly for crit fall if near ground/jump
                      boolean risingFromJump = !client.player.isOnGround() && client.player.getVelocity().y > 0.05 && client.player.fallDistance < 0.25f;
                      if (risingFromJump) {
                          return;
                      }
                  }

                  if (requireSprint.getValue() && !client.player.isSprinting()) {
                      return;
                  }

                  if (hitChance.getValue() < 100.0) {
                      double roll = ThreadLocalRandom.current().nextDouble() * 100.0;
                      if (roll > hitChance.getValue()) {
                          scheduleNextClick(now);
                          return;
                      }
                  }

                  if (stopSprintOnCrit.getValue() && canCritNow && client.player.isSprinting()) {
                      client.player.setSprinting(false);
                  }

                  client.interactionManager.attackEntity(client.player, target);
                  if (swingOnlyOnHit.getValue()) {
                      client.player.swingHand(Hand.MAIN_HAND);
                  }

                  scheduleNextClick(now);
              }

              private boolean isFallingCritWindow(MinecraftClient client) {
                  if (client.player == null) return false;
                  return client.player.fallDistance > 0.0f
                          && !client.player.isOnGround()
                          && !client.player.isClimbing()
                          && !client.player.isTouchingWater()
                          && !client.player.isInLava()
                          && !client.player.hasVehicle();
              }

              private void scheduleNextClick(long now) {
                  double low = Math.min(minCps.getValue(), maxCps.getValue());
                  double high = Math.max(minCps.getValue(), maxCps.getValue());
                  double cps = low + ThreadLocalRandom.current().nextDouble() * (high - low);
                  long intervalMs = (long) (1000.0 / Math.max(1.0, cps));
                  long gaussianOffset = (long) (ThreadLocalRandom.current().nextGaussian() * 10.0);
                  nextAllowedAttackMs = now + Math.max(50L, intervalMs + gaussianOffset);
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/impl/AutoShieldBreakerModule.java
          package com.velour.client.module.impl;

          import com.velour.client.module.Category;
          import com.velour.client.module.Module;
          import com.velour.client.module.setting.BooleanSetting;
          import com.velour.client.module.setting.NumberSetting;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.AxeItem;
          import net.minecraft.item.ItemStack;
          import net.minecraft.util.Hand;
          import net.minecraft.util.hit.EntityHitResult;

          import java.util.concurrent.ThreadLocalRandom;

          public class AutoShieldBreakerModule extends Module {
              private final NumberSetting minDelayMs = addSetting(new NumberSetting("Min Delay ms", 40.0, 0.0, 250.0, 5.0));
              private final NumberSetting maxDelayMs = addSetting(new NumberSetting("Max Delay ms", 95.0, 5.0, 350.0, 5.0));
              private final NumberSetting swapBackDelayMs = addSetting(new NumberSetting("SwapBack ms", 60.0, 0.0, 300.0, 10.0));
              private final NumberSetting cooldownReq = addSetting(new NumberSetting("Cooldown Req", 0.90, 0.5, 1.0, 0.02));
              private final BooleanSetting autoSwapAxe = addSetting(new BooleanSetting("Auto Swap Axe", true));
              private final BooleanSetting swapBack = addSetting(new BooleanSetting("Swap Back", true));
              private final BooleanSetting swingHand = addSetting(new BooleanSetting("Swing Hand", true));

              private long shieldDetectedAtMs = -1L;
              private long scheduledBreakAtMs = -1L;
              private long swapBackAtMs = -1L;
              private int previousSlot = -1;
              private boolean swapped = false;

              public AutoShieldBreakerModule() {
                  super("AutoShieldBreaker", "Timed axe swap and shield break with customizable return delay.", Category.COMBAT);
              }

              @Override
              protected void onDisable() {
                  resetSchedule();
                  previousSlot = -1;
                  swapped = false;
                  swapBackAtMs = -1L;
              }

              @Override
              public void onTick(MinecraftClient client) {
                  if (client.player == null || client.interactionManager == null) return;

                  long now = System.currentTimeMillis();

                  if (swapped && swapBack.getValue() && previousSlot != -1) {
                      if (swapBackAtMs != -1L && now >= swapBackAtMs && client.player.getAttackCooldownProgress(0.5f) >= 0.75f) {
                          client.player.getInventory().setSelectedSlot(previousSlot);
                          previousSlot = -1;
                          swapped = false;
                          swapBackAtMs = -1L;
                      }
                  }

                  if (!(client.crosshairTarget instanceof EntityHitResult hitResult)) {
                      resetSchedule();
                      return;
                  }

                  Entity entity = hitResult.getEntity();
                  if (!(entity instanceof PlayerEntity targetPlayer) || !targetPlayer.isBlocking()) {
                      resetSchedule();
                      return;
                  }

                  if (shieldDetectedAtMs == -1L) {
                      shieldDetectedAtMs = now;
                      double low = Math.min(minDelayMs.getValue(), maxDelayMs.getValue());
                      double high = Math.max(minDelayMs.getValue(), maxDelayMs.getValue());
                      long delay = (long) (low + ThreadLocalRandom.current().nextDouble() * (high - low));
                      scheduledBreakAtMs = now + delay;
                      return;
                  }

                  if (now < scheduledBreakAtMs) return;

                  if (!isHoldingAxe(client.player)) {
                      if (!autoSwapAxe.getValue()) return;
                      int axeSlot = findAxeSlot(client.player);
                      if (axeSlot == -1) return;
                      previousSlot = client.player.getInventory().getSelectedSlot();
                      client.player.getInventory().setSelectedSlot(axeSlot);
                      swapped = true;
                  }

                  if (client.player.getAttackCooldownProgress(0.5f) >= cooldownReq.getValue().floatValue()) {
                      client.interactionManager.attackEntity(client.player, targetPlayer);
                      if (swingHand.getValue()) {
                          client.player.swingHand(Hand.MAIN_HAND);
                      }
                      swapBackAtMs = now + swapBackDelayMs.getValue().longValue();
                      resetSchedule();
                  }
              }

              private boolean isHoldingAxe(PlayerEntity player) {
                  ItemStack stack = player.getMainHandStack();
                  return !stack.isEmpty() && stack.getItem() instanceof AxeItem;
              }

              private int findAxeSlot(PlayerEntity player) {
                  for (int i = 0; i < 9; i++) {
                      ItemStack stack = player.getInventory().getStack(i);
                      if (!stack.isEmpty() && stack.getItem() instanceof AxeItem) {
                          return i;
                      }
                  }
                  return -1;
              }

              private void resetSchedule() {
                  shieldDetectedAtMs = -1L;
                  scheduledBreakAtMs = -1L;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/impl/AutoJumpResetModule.java
          package com.velour.client.module.impl;

          import com.velour.client.module.Category;
          import com.velour.client.module.Module;
          import com.velour.client.module.setting.BooleanSetting;
          import com.velour.client.module.setting.NumberSetting;
          import net.minecraft.client.MinecraftClient;

          import java.util.concurrent.ThreadLocalRandom;

          public class AutoJumpResetModule extends Module {
              private final NumberSetting chance = addSetting(new NumberSetting("Chance %", 80.0, 0.0, 100.0, 5.0));
              private final NumberSetting tickDelay = addSetting(new NumberSetting("Tick Delay", 1.0, 0.0, 4.0, 1.0));
              private final NumberSetting minHurtTime = addSetting(new NumberSetting("Min HurtTime", 1.0, 1.0, 10.0, 1.0));
              private final BooleanSetting requireForward = addSetting(new BooleanSetting("Require Forward", true));
              private final BooleanSetting onlyOnGround = addSetting(new BooleanSetting("Only On Ground", true));
              private final BooleanSetting avoidLiquids = addSetting(new BooleanSetting("Avoid Liquids", true));

              private int lastHurtTime = 0;
              private int pendingJumpTicks = -1;

              public AutoJumpResetModule() {
                  super("AutoJumpReset", "Timed probabilistic jump reset on incoming hit knockback.", Category.MOVEMENT);
              }

              @Override
              public void onTick(MinecraftClient client) {
                  if (client.player == null) return;

                  int hurtTime = client.player.hurtTime;
                  if (hurtTime > lastHurtTime && hurtTime >= minHurtTime.getValue().intValue()) {
                      boolean forwardOk = !requireForward.getValue() || client.options.forwardKey.isPressed();
                      boolean groundOk = !onlyOnGround.getValue() || client.player.isOnGround();
                      boolean rollPass = ThreadLocalRandom.current().nextDouble() * 100.0 <= chance.getValue();

                      if (forwardOk && groundOk && rollPass) {
                          pendingJumpTicks = tickDelay.getValue().intValue();
                      }
                  }
                  lastHurtTime = hurtTime;

                  if (pendingJumpTicks > 0) {
                      pendingJumpTicks--;
                      return;
                  }

                  if (pendingJumpTicks == 0) {
                      pendingJumpTicks = -1;
                      boolean liquidBlocked = avoidLiquids.getValue() && (client.player.isTouchingWater() || client.player.isInLava());
                      if (client.player.isOnGround() && !liquidBlocked) {
                          client.player.jump();
                      }
                  }
              }
          }
