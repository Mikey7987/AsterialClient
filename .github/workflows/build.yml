name: Build Velour 1.21.11 All-In-One

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Project Files
        run: |
          mkdir -p src/main/java/com/velour/client/module/setting
          mkdir -p src/main/java/com/velour/client/module/impl
          mkdir -p src/main/java/com/velour/client/gui
          mkdir -p src/main/resources

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          fabric_version=0.141.2+1.21.11
          mod_version=1.0.0
          maven_group=com.velour
          archives_base_name=velour-1.21.11
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.14.4'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "velour",
            "version": "${version}",
            "name": "Velour",
            "description": "1.21.11 Fabric PvP client with Right Shift ClickGUI.",
            "authors": ["Velour"],
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.velour.client.VelourClient"
              ]
            },
            "depends": {
              "fabricloader": ">=0.18.4",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/VelourClient.java
          package com.velour.client;

          import com.velour.client.gui.ClickGuiScreen;
          import com.velour.client.module.ModuleManager;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public class VelourClient implements ClientModInitializer {
              public static final String MOD_ID = "velour";
              public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

              private static VelourClient instance;
              private ModuleManager moduleManager;
              private KeyBinding clickGuiKey;
              private boolean rightShiftWasDown = false;

              @Override
              public void onInitializeClient() {
                  instance = this;
                  this.moduleManager = new ModuleManager();

                  this.clickGuiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.velour.clickgui",
                          InputUtil.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT,
                          "category.velour.general"
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(this::onClientTick);
                  LOGGER.info("Velour 1.21.11 initialized.");
              }

              private void onClientTick(MinecraftClient client) {
                  if (client.player == null) return;

                  long windowHandle = client.getWindow().getHandle();
                  boolean rightShiftDown = GLFW.glfwGetKey(windowHandle, GLFW.GLFW_KEY_RIGHT_SHIFT) == GLFW.GLFW_PRESS;

                  if ((clickGuiKey.wasPressed() || (rightShiftDown && !rightShiftWasDown)) && client.currentScreen == null) {
                      client.setScreen(new ClickGuiScreen(moduleManager));
                  }
                  rightShiftWasDown = rightShiftDown;

                  if (client.currentScreen == null) {
                      moduleManager.onTick(client);
                  }
              }

              public static VelourClient getInstance() {
                  return instance;
              }

              public ModuleManager getModuleManager() {
                  return moduleManager;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/Category.java
          package com.velour.client.module;

          public enum Category {
              COMBAT("Combat"),
              MOVEMENT("Movement");

              private final String displayName;

              Category(String displayName) {
                  this.displayName = displayName;
              }

              public String getDisplayName() {
                  return displayName;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/Module.java
          package com.velour.client.module;

          import com.velour.client.module.setting.Setting;
          import net.minecraft.client.MinecraftClient;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          public abstract class Module {
              private final String name;
              private final String description;
              private final Category category;
              private final List<Setting<?>> settings = new ArrayList<>();
              private boolean enabled;

              protected Module(String name, String description, Category category) {
                  this.name = name;
                  this.description = description;
                  this.category = category;
              }

              protected <T extends Setting<?>> T addSetting(T setting) {
                  settings.add(setting);
                  return setting;
              }

              public List<Setting<?>> getSettings() {
                  return Collections.unmodifiableList(settings);
              }

              public String getName() {
                  return name;
              }

              public String getDescription() {
                  return description;
              }

              public Category getCategory() {
                  return category;
              }

              public boolean isEnabled() {
                  return enabled;
              }

              public void setEnabled(boolean enabled) {
                  if (this.enabled == enabled) return;
                  this.enabled = enabled;
                  if (enabled) {
                      onEnable();
                  } else {
                      onDisable();
                  }
              }

              public void toggle() {
                  setEnabled(!this.enabled);
              }

              protected void onEnable() {}
              protected void onDisable() {}
              public void onTick(MinecraftClient client) {}
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/setting/Setting.java
          package com.velour.client.module.setting;

          public abstract class Setting<T> {
              private final String name;
              protected T value;

              protected Setting(String name, T defaultValue) {
                  this.name = name;
                  this.value = defaultValue;
              }

              public String getName() {
                  return name;
              }

              public T getValue() {
                  return value;
              }

              public void setValue(T value) {
                  this.value = value;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/setting/BooleanSetting.java
          package com.velour.client.module.setting;

          public class BooleanSetting extends Setting<Boolean> {
              public BooleanSetting(String name, boolean defaultValue) {
                  super(name, defaultValue);
              }

              public void toggle() {
                  this.value = !this.value;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/velour/client/module/setting/NumberSetting.java
          package com.velour.client.module.setting;

          public class NumberSetting extends Setting<Double> {
              private final double min;
              private final double max;
              private final double step;

              public NumberSetting(String name, double defaultValue, double min, double max, double step)
