          cat << 'EOF' > src/main/java/com/velour/client/gui/ClickGuiScreen.java
          package com.velour.client.gui;

          import com.velour.client.module.Category;
          import com.velour.client.module.Module;
          import com.velour.client.module.ModuleManager;
          import com.velour.client.module.setting.BooleanSetting;
          import com.velour.client.module.setting.NumberSetting;
          import com.velour.client.module.setting.Setting;
          import net.minecraft.client.gui.Click;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.input.KeyInput;
          import net.minecraft.text.Text;
          import net.minecraft.util.math.MathHelper;
          import org.lwjgl.glfw.GLFW;

          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public class ClickGuiScreen extends Screen {
              private static final int PANEL_WIDTH = 138;
              private static final int HEADER_HEIGHT = 20;
              private static final int MODULE_HEIGHT = 16;
              private static final int SETTING_HEIGHT = 14;

              private static final int BG_BACKDROP = 0x99090B10;
              private static final int PANEL_BG = 0xE612161F;
              private static final int HEADER_BG = 0xFF191F2C;
              private static final int ACCENT = 0xFF5B8CFF;
              private static final int MODULE_ON_BG = 0xFF1E2A44;
              private static final int TEXT_MAIN = 0xFFF3F6FA;
              private static final int TEXT_MUTED = 0xFF9AA5B8;

              private final ModuleManager moduleManager;
              private final Map<Module, Boolean> expandedModules = new HashMap<>();
              private final Map<Category, int[]> panelPositions = new HashMap<>();

              private Category draggingPanel = null;
              private int dragOffsetX = 0;
              private int dragOffsetY = 0;

              private NumberSetting activeSlider = null;
              private int sliderX = 0;
              private int sliderW = 0;

              public ClickGuiScreen(ModuleManager moduleManager) {
                  super(Text.literal("Velour ClickGUI"));
                  this.moduleManager = moduleManager;

                  int startX = 20;
                  int startY = 24;
                  for (Category cat : Category.values()) {
                      panelPositions.put(cat, new int[]{startX, startY});
                      startX += PANEL_WIDTH + 16;
                  }
              }

              @Override
              public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                  context.fill(0, 0, this.width, this.height, BG_BACKDROP);

                  if (activeSlider != null) {
                      updateSliderValue(mouseX);
                  }

                  for (Category category : Category.values()) {
                      int[] pos = panelPositions.get(category);
                      int px = pos[0];
                      int py = pos[1];

                      List<Module> modules = moduleManager.getByCategory(category);
                      int totalHeight = HEADER_HEIGHT + computeListHeight(modules) + 4;

                      context.fill(px + 2, py + 2, px + PANEL_WIDTH + 2, py + totalHeight + 2, 0x55000000);
                      context.fill(px, py, px + PANEL_WIDTH, py + totalHeight, PANEL_BG);
                      context.fill(px, py, px + PANEL_WIDTH, py + HEADER_HEIGHT, HEADER_BG);
                      context.fill(px, py + HEADER_HEIGHT - 1, px + PANEL_WIDTH, py + HEADER_HEIGHT, ACCENT);

                      context.drawTextWithShadow(this.textRenderer, category.getDisplayName(), px + 8, py + 6, TEXT_MAIN);

                      int cursorY = py + HEADER_HEIGHT + 2;
                      for (Module module : modules) {
                          boolean hovered = isInside(mouseX, mouseY, px + 2, cursorY, PANEL_WIDTH - 4, MODULE_HEIGHT);
                          int rowBg = module.isEnabled() ? MODULE_ON_BG : (hovered ? 0x33FFFFFF : 0x00000000);

                          context.fill(px + 2, cursorY, px + PANEL_WIDTH - 2, cursorY + MODULE_HEIGHT, rowBg);
                          if (module.isEnabled()) {
                              context.fill(px + 2, cursorY, px + 4, cursorY + MODULE_HEIGHT, ACCENT);
                          }

                          int nameColor = module.isEnabled() ? TEXT_MAIN : (hovered ? TEXT_MAIN : TEXT_MUTED);
                          context.drawTextWithShadow(this.textRenderer, module.getName(), px + 8, cursorY + 4, nameColor);

                          boolean isOpen = expandedModules.getOrDefault(module, false);
                          String arrow = isOpen ? "-" : "+";
                          context.drawTextWithShadow(this.textRenderer, arrow, px + PANEL_WIDTH - 12, cursorY + 4, TEXT_MUTED);

                          cursorY += MODULE_HEIGHT;

                          if (isOpen) {
                              for (Setting<?> setting : module.getSettings()) {
                                  if (setting instanceof BooleanSetting boolSetting) {
                                      boolean bHover = isInside(mouseX, mouseY, px + 6, cursorY, PANEL_WIDTH - 12, SETTING_HEIGHT);
                                      context.fill(px + 6, cursorY + 1, px + PANEL_WIDTH - 6, cursorY + SETTING_HEIGHT - 1, bHover ? 0x22FFFFFF : 0x11000000);
                                      int color = boolSetting.getValue() ? ACCENT : TEXT_MUTED;
                                      context.drawTextWithShadow(
                                              this.textRenderer,
                                              boolSetting.getName() + ": " + (boolSetting.getValue() ? "ON" : "OFF"),
                                              px + 10,
                                              cursorY + 3,
                                              color
                                      );
                                  } else if (setting instanceof NumberSetting numSetting) {
                                      int sx = px + 8;
                                      int sw = PANEL_WIDTH - 16;
                                      double span = Math.max(0.0001, numSetting.getMax() - numSetting.getMin());
                                      double pct = MathHelper.clamp((numSetting.getValue() - numSetting.getMin()) / span, 0.0, 1.0);
                                      int fillW = (int) (sw * pct);

                                      context.fill(sx, cursorY + 2, sx + sw, cursorY + SETTING_HEIGHT - 1, 0xFF0C0F16);
                                      context.fill(sx, cursorY + 2, sx + fillW, cursorY + SETTING_HEIGHT - 1, ACCENT);

                                      String label = numSetting.getName() + " " + formatNum(numSetting.getValue());
                                      context.drawTextWithShadow(this.textRenderer, label, sx + 3, cursorY + 3, TEXT_MAIN);
                                  }
                                  cursorY += SETTING_HEIGHT;
                              }
                          }
                      }
                  }

                  super.render(context, mouseX, mouseY, delta);
              }

              @Override
              public boolean mouseClicked(Click click, boolean doubled) {
                  double mouseX = click.x();
                  double mouseY = click.y();
                  int button = click.button();

                  for (Category category : Category.values()) {
                      int[] pos = panelPositions.get(category);
                      int px = pos[0];
                      int py = pos[1];

                      if (button == 0 && isInside(mouseX, mouseY, px, py, PANEL_WIDTH, HEADER_HEIGHT)) {
                          draggingPanel = category;
                          dragOffsetX = (int) mouseX - px;
                          dragOffsetY = (int) mouseY - py;
                          return true;
                      }

                      int cursorY = py + HEADER_HEIGHT + 2;
                      for (Module module : moduleManager.getByCategory(category)) {
                          if (isInside(mouseX, mouseY, px + 2, cursorY, PANEL_WIDTH - 4, MODULE_HEIGHT)) {
                              if (button == 0) {
                                  module.toggle();
                                  return true;
                              } else if (button == 1) {
                                  expandedModules.put(module, !expandedModules.getOrDefault(module, false));
                                  return true;
                              }
                          }
                          cursorY += MODULE_HEIGHT;

                          if (expandedModules.getOrDefault(module, false)) {
                              for (Setting<?> setting : module.getSettings()) {
                                  if (setting instanceof BooleanSetting boolSetting && button == 0) {
                                      if (isInside(mouseX, mouseY, px + 6, cursorY, PANEL_WIDTH - 12, SETTING_HEIGHT)) {
                                          boolSetting.toggle();
                                          return true;
                                      }
                                  } else if (setting instanceof NumberSetting numSetting && button == 0) {
                                      int sx = px + 8;
                                      int sw = PANEL_WIDTH - 16;
                                      if (isInside(mouseX, mouseY, sx, cursorY + 1, sw, SETTING_HEIGHT - 1)) {
                                          activeSlider = numSetting;
                                          sliderX = sx;
                                          sliderW = sw;
                                          updateSliderValue(mouseX);
                                          return true;
                                      }
                                  }
                                  cursorY += SETTING_HEIGHT;
                              }
                          }
                      }
                  }

                  return super.mouseClicked(click, doubled);
              }

              @Override
              public boolean mouseReleased(Click click) {
                  draggingPanel = null;
                  activeSlider = null;
                  return super.mouseReleased(click);
              }

              @Override
              public boolean mouseDragged(Click click, double deltaX, double deltaY) {
                  double mouseX = click.x();
                  double mouseY = click.y();

                  if (draggingPanel != null) {
                      int[] pos = panelPositions.get(draggingPanel);
                      pos[0] = (int) mouseX - dragOffsetX;
                      pos[1] = (int) mouseY - dragOffsetY;
                      return true;
                  }
                  if (activeSlider != null) {
                      updateSliderValue(mouseX);
                      return true;
                  }
                  return super.mouseDragged(click, deltaX, deltaY);
              }

              @Override
              public boolean keyPressed(KeyInput input) {
                  int keyCode = input.key();
                  if (keyCode == GLFW.GLFW_KEY_RIGHT_SHIFT || keyCode == GLFW.GLFW_KEY_ESCAPE) {
                      this.close();
                      return true;
                  }
                  return super.keyPressed(input);
              }

              @Override
              public boolean shouldPause() {
                  return false;
              }

              private void updateSliderValue(double mouseX) {
                  if (activeSlider == null || sliderW <= 0) return;
                  double ratio = MathHelper.clamp((mouseX - sliderX) / (double) sliderW, 0.0, 1.0);
                  double raw = activeSlider.getMin() + ratio * (activeSlider.getMax() - activeSlider.getMin());
                  activeSlider.setValue(raw);
              }

              private int computeListHeight(List<Module> modules) {
                  int h = 0;
                  for (Module m : modules) {
                      h += MODULE_HEIGHT;
                      if (expandedModules.getOrDefault(m, false)) {
                          h += m.getSettings().size() * SETTING_HEIGHT;
                      }
                  }
                  return h;
              }

              private boolean isInside(double mx, double my, int x, int y, int w, int h) {
                  return mx >= x && mx <= x + w && my >= y && my <= y + h;
              }

              private String formatNum(double val) {
                  if (Math.abs(val - Math.round(val)) < 0.0001) {
                      return Long.toString(Math.round(val));
                  }
                  return String.format("%.2f", val);
              }
          }
          EOF

      - name: Build Fabric Mod Jar
        run: gradle build --no-daemon

      - name: List Built Jars
        run: find build -name "*.jar" -type f

      - name: Upload Compiled Jar
        uses: actions/upload-artifact@v4
        with:
          name: velour-1.21.11-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
